[project]
name = "ai-trainer-garmin"
version = "0.1.0"
description = "Chat with an AI coach, get a periodized plan, send workouts to your Garmin"
readme = "README.md"
authors = [
    { name = "Vic", email = "vicentecfcmonteiro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fit-tool>=0.9.16",
    "garminconnect>=0.3.17",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
local = ["fastapi>=0.143.1", "uvicorn>=0.54.0"]

[project.scripts]
ai-trainer-garmin = "ai_trainer_garmin:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.143.1",
    "fitparse>=1.2.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["BLE001", "S112", "S110", "B008"]
