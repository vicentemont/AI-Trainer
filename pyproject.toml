[project]
name = "ai-trainer-garmin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vic", email = "vicentecfcmonteiro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.143.1",
    "fit-tool>=0.9.16",
    "fitparse>=1.2.0",
    "garminconnect>=0.3.17",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-trainer-garmin = "ai_trainer_garmin:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["BLE001", "S112", "S110", "B008"]
